# Dev loop, layered on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f compose.dev.yml up
# frontend: ng serve with polling -> http://localhost:4200 (saving a file reloads the browser)
# backend : mvn spring-boot:run from the mounted source; after Java edits run
#           docker compose -f docker-compose.yml -f compose.dev.yml restart backend
services:
  backend:
    build: !reset null
    image: maven:3.9-eclipse-temurin-25
    working_dir: /src
    command: [ "mvn", "-B", "-q", "spring-boot:run" ]
    volumes:
      - ./backend:/src
      - m2:/root/.m2
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'" ]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 180s

  frontend:
    build: !reset null
    image: node:24-alpine
    working_dir: /app
    command: [ "sh", "-c", "npm ci && npx ng serve --host 0.0.0.0 --poll 2000 --proxy-config proxy.conf.json" ]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports: !override
      - "4200:4200"

volumes:
  m2:
