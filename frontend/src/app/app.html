<mat-sidenav-container class="shell">
  <mat-sidenav #drawer class="nav" [mode]="isHandset() ? 'over' : 'side'" [opened]="!isHandset()">
    <div class="brand"><app-brand-mark /></div>

    <nav aria-label="Main menu">
      @for (g of groups; track g.label) {
        <div class="group">
          <div class="group-label">{{ g.label }}</div>
          @for (item of g.items; track item.path) {
            <a class="item" [routerLink]="item.path" routerLinkActive="active" (click)="isHandset() && drawer.close()">
              @if (item.logo) {
                <app-tool-logo [name]="item.logo" [size]="18" mono="currentColor" />
              } @else {
                <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
              }
              <span>{{ item.label }}</span>
            </a>
          }
        </div>
      }
    </nav>

    <div class="foot">
      @if (dataMode(); as mode) {
        <span class="mode" [class.live]="mode === 'Live data'">{{ mode }}</span>
      }
      <span class="foot-note">EFT · Euronet India</span>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    @if (isHandset()) {
      <div class="topbar">
        <button class="menu" type="button" aria-label="Open menu" (click)="drawer.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
        <app-brand-mark [compact]="true" />
      </div>
    }
    <main>
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
