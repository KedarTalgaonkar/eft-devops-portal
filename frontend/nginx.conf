server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # REST API, Swagger UI and health go to the Spring Boot container
    location ~ ^/(api|actuator|v3/api-docs|swagger-ui)(/|$|\.html) {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_read_timeout 120s;
    }

    # hashed bundles can be cached for a long time
    location ~* \.(?:js|css|woff2?|ttf|png|svg|ico)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # SPA: every other path is an Angular route
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        # per-request CSP nonce for Angular's injected styles (same $request_id as in the CSP header)
        sub_filter '__CSP_NONCE__' '$request_id';
        sub_filter_once off;
        try_files $uri $uri/ /index.html;
    }
}
