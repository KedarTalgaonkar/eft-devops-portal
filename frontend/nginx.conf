# Rate limits per client IP (protect sign-in against guessing, the API against floods)
limit_req_zone $binary_remote_addr zone=portal_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=portal_api:10m rate=30r/s;
limit_req_status 429;

# Keep the original scheme when an HTTPS ingress / load balancer terminates TLS in front of this container
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Public port for redirects (SSO start, OIDC callback): an upstream proxy's value, else the port in the Host header.
# Empty means the scheme default (80/443). Without it Tomcat assumes 80 and drops e.g. :8081 from redirects.
map $http_host $host_port {
    "~:(?<p>\d+)$" $p;
    default        "";
}
map $http_x_forwarded_port $forwarded_port {
    default $http_x_forwarded_port;
    ""      $host_port;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Shared proxy settings for the Spring Boot backend
    set $backend http://backend:8080;

    # Sign-in endpoints: strict rate limit
    location ~ ^/(api/auth/login|api/auth/sso|oauth2/authorization/|login/oauth2/code/) {
        limit_req zone=portal_login burst=10 nodelay;
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/proxy-backend.conf;
    }

    # REST API, Swagger UI (admins only) and health
    location ~ ^/(api|actuator|v3/api-docs|swagger-ui)(/|$|\.html) {
        limit_req zone=portal_api burst=60 nodelay;
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/proxy-backend.conf;
    }

    # hashed bundles can be cached for a long time
    location ~* \.(?:js|css|woff2?|ttf|png|svg|ico)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # SPA: every other path is an Angular route
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        # per-request CSP nonce for Angular's injected styles (same $request_id as in the CSP header)
        sub_filter '__CSP_NONCE__' '$request_id';
        sub_filter_once off;
        try_files $uri $uri/ /index.html;
    }
}
