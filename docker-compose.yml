# Prod-like stack:  docker compose up --build -d
#   browser -> frontend (nginx) http://localhost:8081 -> backend :8080 -> postgres
#   sign-in: local Keycloak on http://localhost:8180 (stands in for Microsoft Entra ID), or local accounts
# For Entra ID set SPRING_PROFILES_ACTIVE=sso-entra (+ ENTRA_TENANT_ID, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET)
# and start without the local identity provider:  docker compose up -d postgres backend frontend
name: eft-devops-portal

x-integrations: &integrations
  JENKINS_MODE: ${JENKINS_MODE:-mock}
  JENKINS_URL: ${JENKINS_URL:-}
  JENKINS_USER: ${JENKINS_USER:-}
  JENKINS_TOKEN: ${JENKINS_TOKEN:-}
  JENKINS_JOB_PATTERN: ${JENKINS_JOB_PATTERN:-}
  GITHUB_MODE: ${GITHUB_MODE:-mock}
  GITHUB_URL: ${GITHUB_URL:-https://api.github.com}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  SONAR_MODE: ${SONAR_MODE:-mock}
  SONAR_URL: ${SONAR_URL:-}
  SONAR_TOKEN: ${SONAR_TOKEN:-}
  ARTIFACTORY_MODE: ${ARTIFACTORY_MODE:-mock}
  ARTIFACTORY_URL: ${ARTIFACTORY_URL:-}
  ARTIFACTORY_TOKEN: ${ARTIFACTORY_TOKEN:-}
  MONITORING_MODE: ${MONITORING_MODE:-mock}
  GRAFANA_URL: ${GRAFANA_URL:-}
  GRAFANA_TOKEN: ${GRAFANA_TOKEN:-}
  PROMETHEUS_URL: ${PROMETHEUS_URL:-}
  SBOM_MODE: ${SBOM_MODE:-mock}
  HEALTH_PROBE_MODE: ${HEALTH_PROBE_MODE:-mock}

x-security: &security
  # sign-in
  ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  # local Keycloak only (sso-dev profile); must match docker/keycloak/eft-realm.json
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-eft-portal-dev-secret}
  PORTAL_SSO_LABEL: ${PORTAL_SSO_LABEL:-}
  PORTAL_LOCAL_LOGIN: ${PORTAL_LOCAL_LOGIN:-true}
  PORTAL_DEFAULT_ROLE: ${PORTAL_DEFAULT_ROLE:-VIEWER}
  PORTAL_BOOTSTRAP_ADMIN_USERNAME: ${PORTAL_BOOTSTRAP_ADMIN_USERNAME:-admin}
  PORTAL_BOOTSTRAP_ADMIN_PASSWORD: ${PORTAL_BOOTSTRAP_ADMIN_PASSWORD:-}
  # sessions and cookies
  PORTAL_COOKIE_SECURE: ${PORTAL_COOKIE_SECURE:-false}
  PORTAL_SESSION_IDLE_TIMEOUT: ${PORTAL_SESSION_IDLE_TIMEOUT:-30m}
  PORTAL_SESSION_MAX_AGE: ${PORTAL_SESSION_MAX_AGE:-10h}
  PORTAL_API_DOCS: ${PORTAL_API_DOCS:-true}

# AI features (docs/ai.md). This dev stack defaults to mock: sample answers, nothing leaves the machine.
x-ai: &ai
  AI_MODE: ${AI_MODE:-mock}
  AI_PROVIDER: ${AI_PROVIDER:-anthropic}
  AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-100}
  AI_USER_DAILY_LIMIT: ${AI_USER_DAILY_LIMIT:-50}
  AI_MAX_LOG_KB: ${AI_MAX_LOG_KB:-64}
  AI_MASK_DOMAINS: ${AI_MASK_DOMAINS:-.internal,.local,.corp,.lan}
  AI_DIGEST_ENABLED: ${AI_DIGEST_ENABLED:-true}
  AI_DIGEST_CRON: ${AI_DIGEST_CRON:-0 0 7 * * MON-FRI}
  AI_DIGEST_ZONE: ${AI_DIGEST_ZONE:-Asia/Kolkata}
  # Amazon Bedrock (AI_PROVIDER=bedrock): region plus a Bedrock API key, or AWS credentials / an IAM role
  AWS_REGION: ${AWS_REGION:-}
  AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
  # Microsoft Foundry (AI_PROVIDER=foundry)
  ANTHROPIC_FOUNDRY_API_KEY: ${ANTHROPIC_FOUNDRY_API_KEY:-}
  ANTHROPIC_FOUNDRY_RESOURCE: ${ANTHROPIC_FOUNDRY_RESOURCE:-}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eftportal}
      POSTGRES_USER: ${POSTGRES_USER:-eft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eft}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Local identity provider for development (Microsoft Entra ID in production). Test users: see docs/security.md
  keycloak:
    image: keycloak/keycloak:26.8
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me-local-only}
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./docker/keycloak/eft-realm.json:/opt/keycloak/data/import/eft-realm.json:ro
    ports:
      - "127.0.0.1:8180:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
    environment:
      <<: [*integrations, *security, *ai]
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev,sso-dev}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-eftportal}
      DB_USER: ${POSTGRES_USER:-eft}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-eft}
    depends_on:
      postgres:
        condition: service_healthy
    # only reachable from this machine: users go through nginx (headers, rate limits)
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PORTAL_BIND_ADDRESS:-127.0.0.1}:8081:80"
    restart: unless-stopped

volumes:
  pgdata:
