spring:
  application:
    name: eft-portal-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eftportal}
    username: ${DB_USER:eft}
    password: ${DB_PASSWORD:eft}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  cache:
    type: caffeine
    cache-names: jenkins-builds,github,sonar,artifactory,monitoring
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=60s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

portal:
  cors:
    allowed-origins: http://localhost:4200,http://localhost:8081
  integrations:
    jenkins:
      mode: ${JENKINS_MODE:mock}
      base-url: ${JENKINS_URL:}
      username: ${JENKINS_USER:}
      token: ${JENKINS_TOKEN:}
    github:
      mode: ${GITHUB_MODE:mock}
      base-url: ${GITHUB_URL:https://api.github.com}
      token: ${GITHUB_TOKEN:}
    sonar:
      mode: ${SONAR_MODE:mock}
      base-url: ${SONAR_URL:}
      token: ${SONAR_TOKEN:}
    artifactory:
      mode: ${ARTIFACTORY_MODE:mock}
      base-url: ${ARTIFACTORY_URL:}
      token: ${ARTIFACTORY_TOKEN:}
    monitoring:
      mode: ${MONITORING_MODE:mock}
      base-url: ${GRAFANA_URL:}
      token: ${GRAFANA_TOKEN:}
      secondary-url: ${PROMETHEUS_URL:}
    sbom:
      mode: ${SBOM_MODE:mock}
  pipelines:
    # Used when a deployment has no Jenkins job set. Placeholders: {app} {client} {ENV} {env}
    job-pattern: ${JENKINS_JOB_PATTERN:}
    default-days: 30
    max-builds: 200
  health:
    mode: ${HEALTH_PROBE_MODE:mock}
    interval: PT2M
    timeout: PT3S
