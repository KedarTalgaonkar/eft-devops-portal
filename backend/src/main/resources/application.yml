spring:
  application:
    name: eft-portal-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eftportal}
    username: ${DB_USER:eft}
    password: ${DB_PASSWORD:eft}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  cache:
    type: caffeine
    cache-names: jenkins-builds,github,sonar,artifactory,monitoring
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=60s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # Server-side sessions in PostgreSQL (tables from Flyway V4): survive restarts, shared by several backend instances
  session:
    timeout: ${PORTAL_SESSION_IDLE_TIMEOUT:30m}
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 */5 * * * *"

server:
  port: 8080
  shutdown: graceful
  # Trust X-Forwarded-* from the nginx / ingress in front (builds correct https redirect URIs, client IPs for audit)
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        name: EFTSESSION
        http-only: true
        # true behind HTTPS (production); false only for http://localhost
        secure: ${PORTAL_COOKIE_SECURE:false}
        # Lax: sent on the top-level redirect back from the identity provider, never on cross-site sub-requests
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    # administrators only; set PORTAL_API_DOCS=false to switch off completely in production
    enabled: ${PORTAL_API_DOCS:true}
    path: /v3/api-docs

portal:
  security:
    local-login-enabled: ${PORTAL_LOCAL_LOGIN:true}
    sso-label: ${PORTAL_SSO_LABEL:Sign in with Microsoft}
    registration-id: sso
    # SSO users whose token carries no mapped role get this role; empty = refuse them
    default-role: ${PORTAL_DEFAULT_ROLE:VIEWER}
    # Entra ID app roles (or group object ids) -> portal roles
    role-mapping:
      "[Portal.Viewer]": VIEWER
      "[Portal.Editor]": EDITOR
      "[Portal.Admin]": ADMIN
    absolute-session-timeout: ${PORTAL_SESSION_MAX_AGE:10h}
    cookie-secure: ${PORTAL_COOKIE_SECURE:false}
    audit-retention: 365d
    lockout:
      max-attempts: 5
      duration: 15m
    bootstrap-admin:
      username: ${PORTAL_BOOTSTRAP_ADMIN_USERNAME:admin}
      password: ${PORTAL_BOOTSTRAP_ADMIN_PASSWORD:}
  integrations:
    jenkins:
      mode: ${JENKINS_MODE:mock}
      base-url: ${JENKINS_URL:}
      username: ${JENKINS_USER:}
      token: ${JENKINS_TOKEN:}
    github:
      mode: ${GITHUB_MODE:mock}
      base-url: ${GITHUB_URL:https://api.github.com}
      token: ${GITHUB_TOKEN:}
    sonar:
      mode: ${SONAR_MODE:mock}
      base-url: ${SONAR_URL:}
      token: ${SONAR_TOKEN:}
    artifactory:
      mode: ${ARTIFACTORY_MODE:mock}
      base-url: ${ARTIFACTORY_URL:}
      token: ${ARTIFACTORY_TOKEN:}
    monitoring:
      mode: ${MONITORING_MODE:mock}
      base-url: ${GRAFANA_URL:}
      token: ${GRAFANA_TOKEN:}
      secondary-url: ${PROMETHEUS_URL:}
    sbom:
      mode: ${SBOM_MODE:mock}
  pipelines:
    # Used when a deployment has no Jenkins job set. Placeholders: {app} {client} {ENV} {env}
    job-pattern: ${JENKINS_JOB_PATTERN:}
    default-days: 30
    max-builds: 200
  health:
    mode: ${HEALTH_PROBE_MODE:mock}
    interval: PT2M
    timeout: PT3S
